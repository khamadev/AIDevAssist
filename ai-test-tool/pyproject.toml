[project]
name = "ai-test-tool"
version = "0.1.0"
description = "Orchestration, documentation, and notification agents for AI-assisted test maintenance"
requires-python = ">=3.10"
dependencies = [
    "watchdog>=4.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
ai-test-tool = "ai_test_tool.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
