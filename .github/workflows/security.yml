name: Security

on:
  push:
    branches: [main]
    paths-ignore:
      - "ai-test-tool/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "ai-test-tool/**"

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Audit dependencies for known vulnerabilities
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt \
            --ignore-vuln PYSEC-2026-1845 \
            --ignore-vuln PYSEC-2026-2263 \
            --ignore-vuln PYSEC-2026-3457 \
            --ignore-vuln PYSEC-2026-3456 \
            --ignore-vuln PYSEC-2026-3455 \
            --ignore-vuln PYSEC-2026-161 \
            --ignore-vuln PYSEC-2026-248 \
            --ignore-vuln PYSEC-2026-249 \
            --ignore-vuln PYSEC-2026-1942 \
            --ignore-vuln PYSEC-2026-1941 \
            --ignore-vuln PYSEC-2026-2281 \
            --ignore-vuln PYSEC-2026-2280 \
            --ignore-vuln PYSEC-2026-1325
          # Ignored, with reasons (re-check periodically, don't let this list grow silently):
          #   PYSEC-2026-1845 (pytest)    - dev/test-only dependency, no production attack surface;
          #                                 fix requires a pytest 9.x major-version bump, deferred.
          #   PYSEC-2026-2263/3455-3457   - pyasn1: python-jose 3.4.0 (the newest available fix
          #     (pyasn1)                    for its own CVEs) caps pyasn1 to a range that predates
          #                                 the fixed version. Can't resolve without dropping
          #                                 python-jose for a different JWT library — bigger change,
          #                                 deferred.
          #   PYSEC-2026-161/248/249/     - starlette: fix requires starlette 1.x, which needs a
          #     1941/1942/2280/2281         newer FastAPI than 0.115.x supports. Deferred pending a
          #     (starlette)                 dedicated FastAPI major-version upgrade.
          #   PYSEC-2026-1325 (ecdsa)     - no fix version published upstream at all (accepted,
          #                                 documented risk in the ecdsa package itself).

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Bandit security scan
        run: |
          pip install bandit
          bandit -r app -ll
