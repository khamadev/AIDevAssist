name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "ai-test-tool/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "ai-test-tool/**"

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q tests/
