name: AI Test Tool - Tests

on:
  push:
    branches: [main]
    paths:
      - "ai-test-tool/**"
  pull_request:
    branches: [main]
    paths:
      - "ai-test-tool/**"

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-test-tool

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q
