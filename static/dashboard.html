<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Trips — Travel Planner</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <a class="brand" href="/static/dashboard.html"><span class="logo-mark">TP</span> Travel Planner</a>
    <button type="button" class="secondary" id="logout-btn">Log out</button>
  </header>

  <main>
    <div class="card">
      <h1>Plan a new trip</h1>
      <form id="trip-form">
        <label for="destination">Destination</label>
        <input type="text" id="destination" placeholder="e.g. Kyoto, Japan" required />

        <div class="field-row">
          <div>
            <label for="start_date">Start date</label>
            <input type="date" id="start_date" required />
          </div>
          <div>
            <label for="end_date">End date</label>
            <input type="date" id="end_date" required />
          </div>
        </div>

        <button type="submit">Add trip</button>
      </form>
      <p id="form-error" class="error"></p>
    </div>

    <div class="toolbar">
      <h2>My Trips</h2>
      <input type="search" id="search" placeholder="Search destinations..." />
    </div>
    <div id="trips-list"><p class="muted">Loading...</p></div>

    <div id="ai-panel" class="card" style="display: none;">
      <h3>AI Day Plan</h3>
      <p id="ai-trip-info" class="muted"></p>

      <div class="field-row">
        <div>
          <label for="ai-days">Days</label>
          <input type="number" id="ai-days" min="1" max="14" value="3" />
        </div>
        <div>
          <label for="ai-preferences">Preferences</label>
          <input type="text" id="ai-preferences" placeholder="food, nature, museums" />
        </div>
      </div>

      <div class="card-actions">
        <button type="button" id="ai-generate-btn">Generate</button>
        <button type="button" class="secondary" id="ai-close-btn">Close</button>
      </div>

      <p id="ai-error" class="error"></p>
      <div id="ai-result"></div>
    </div>
  </main>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/ui.js"></script>
  <script>
    requireAuth();
    document.getElementById("logout-btn").addEventListener("click", logout);

    let allTrips = [];
    let selectedTrip = null;

    async function loadTrips() {
      const response = await apiFetch("/trips");
      if (!response) return;
      allTrips = await response.json();
      renderTrips(allTrips);
    }

    function initials(destination) {
      return destination
        .split(/[\s,]+/)
        .filter(Boolean)
        .slice(0, 2)
        .map((word) => word[0].toUpperCase())
        .join("");
    }

    function renderTrips(trips) {
      const listEl = document.getElementById("trips-list");

      if (trips.length === 0) {
        listEl.innerHTML = `
          <div class="card empty-state">
            <div class="icon">--</div>
            <p>No trips yet. Add your first destination above.</p>
          </div>`;
        return;
      }

      const sorted = [...trips].sort((a, b) => a.start_date.localeCompare(b.start_date));

      listEl.innerHTML = `<div class="trip-grid">${sorted
        .map((trip) => {
          const status = tripStatus(trip.start_date, trip.end_date);
          return `
        <div class="trip-card">
          <a class="cover" href="/static/trip.html?id=${trip.id}" style="background: ${destinationCover(trip.destination)}">${initials(trip.destination)}</a>
          <div class="body">
            <a class="destination" href="/static/trip.html?id=${trip.id}">${trip.destination}</a>
            <div class="dates">${formatDateRange(trip.start_date, trip.end_date)}</div>
            <span class="badge ${status}">${tripStatusLabel(status)}</span>
            <div class="card-actions">
              <button type="button" onclick="openAiPanel(${trip.id})">AI Plan</button>
              <button type="button" class="danger" onclick="deleteTrip(${trip.id})">Delete</button>
            </div>
          </div>
        </div>`;
        })
        .join("")}</div>`;
    }

    document.getElementById("search").addEventListener("input", (event) => {
      const query = event.target.value.toLowerCase();
      renderTrips(allTrips.filter((t) => t.destination.toLowerCase().includes(query)));
    });

    async function deleteTrip(tripId) {
      const response = await apiFetch(`/trips/${tripId}`, { method: "DELETE" });
      if (response?.ok) {
        loadTrips();
      }
    }

    function calcTripDays(startDate, endDate) {
      const s = new Date(startDate);
      const e = new Date(endDate);
      if (Number.isNaN(s.getTime()) || Number.isNaN(e.getTime()) || e < s) return 1;
      return Math.floor((e - s) / (1000 * 60 * 60 * 24)) + 1;
    }

    window.openAiPanel = (tripId) => {
      const trip = allTrips.find((t) => t.id === tripId);
      if (!trip) return;

      selectedTrip = trip;

      const panel = document.getElementById("ai-panel");
      const info = document.getElementById("ai-trip-info");
      const daysInput = document.getElementById("ai-days");
      const resultEl = document.getElementById("ai-result");
      const errEl = document.getElementById("ai-error");

      info.textContent = `Trip: ${trip.destination} (${formatDateRange(trip.start_date, trip.end_date)})`;
      daysInput.value = calcTripDays(trip.start_date, trip.end_date);
      resultEl.innerHTML = "";
      errEl.textContent = "";
      panel.style.display = "block";
      panel.scrollIntoView({ behavior: "smooth", block: "start" });
    };

    document.getElementById("ai-close-btn").addEventListener("click", () => {
      document.getElementById("ai-panel").style.display = "none";
      document.getElementById("ai-result").innerHTML = "";
      document.getElementById("ai-error").textContent = "";
      selectedTrip = null;
    });

    document.getElementById("ai-generate-btn").addEventListener("click", async () => {
      const errEl = document.getElementById("ai-error");
      const resultEl = document.getElementById("ai-result");
      const generateBtn = document.getElementById("ai-generate-btn");
      errEl.textContent = "";
      resultEl.innerHTML = "";

      if (!selectedTrip) {
        errEl.textContent = "Please choose a trip first.";
        return;
      }

      const days = Number(document.getElementById("ai-days").value || 0);
      const preferences = document.getElementById("ai-preferences").value.trim();

      if (days < 1 || days > 14) {
        errEl.textContent = "Days must be between 1 and 14.";
        return;
      }

      const payload = {
        destination: selectedTrip.destination,
        days,
        preferences,
        trip_id: selectedTrip.id,
      };

      generateBtn.disabled = true;
      generateBtn.textContent = "Generating...";

      try {
        const response = await apiFetch("/ai/generate-itinerary", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        if (!response) return;

        if (!response.ok) {
          const data = await response.json().catch(() => ({}));
          errEl.textContent = data.detail || "AI generation failed.";
          return;
        }

        const data = await response.json();
        const daysHtml = (data.days || [])
          .map((d) => {
            const itemsHtml = (d.items || [])
              .map(
                (it) => `
                  <div class="ai-item">
                    <div class="time">${it.time}</div>
                    <div class="details">
                      <div class="title">${it.title}</div>
                      <div class="notes">${it.notes}</div>
                    </div>
                  </div>`
              )
              .join("");
            return `
              <div class="ai-day">
                <div class="ai-day-label">Day ${d.day}</div>
                ${itemsHtml}
              </div>`;
          })
          .join("");

        resultEl.innerHTML = daysHtml || "<p class='muted'>No plan generated.</p>";
      } finally {
        generateBtn.disabled = false;
        generateBtn.textContent = "Generate";
      }
    });

    document.getElementById("trip-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const errorEl = document.getElementById("form-error");
      errorEl.textContent = "";

      const payload = {
        destination: document.getElementById("destination").value,
        start_date: document.getElementById("start_date").value,
        end_date: document.getElementById("end_date").value,
      };

      const response = await apiFetch("/trips", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });

      if (!response) return;

      if (!response.ok) {
        const data = await response.json().catch(() => ({}));
        const detail = Array.isArray(data.detail)
          ? data.detail.map((d) => d.msg).join(", ")
          : data.detail;
        errorEl.textContent = detail || "Could not create trip";
        return;
      }

      document.getElementById("trip-form").reset();
      loadTrips();
    });

    loadTrips();
  </script>
</body>
</html>
