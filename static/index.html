<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Travel Planner</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <a class="brand" href="/static/index.html"><span class="logo-mark">TP</span> Travel Planner</a>
  </header>

  <main class="narrow">
    <div class="auth-hero">
      <div class="logo-mark">TP</div>
      <p>Plan your next trip, day by day.</p>
    </div>

    <div class="card">
      <h1 id="form-title">Log in</h1>
      <form id="auth-form">
        <label for="email">Email</label>
        <input type="email" id="email" required />

        <label for="password">Password</label>
        <input type="password" id="password" required minlength="8" />

        <button type="submit" id="submit-btn">Log in</button>
      </form>
      <p id="error" class="error"></p>
      <p class="link-toggle">
        <span id="toggle-text">Don't have an account?</span>
        <a id="toggle-link">Register</a>
      </p>
    </div>
  </main>

  <script src="/static/js/api.js"></script>
  <script>
    let mode = "login";

    const form = document.getElementById("auth-form");
    const errorEl = document.getElementById("error");
    const title = document.getElementById("form-title");
    const submitBtn = document.getElementById("submit-btn");
    const toggleText = document.getElementById("toggle-text");
    const toggleLink = document.getElementById("toggle-link");

    if (getToken()) {
      window.location.href = "/static/dashboard.html";
    }

    toggleLink.addEventListener("click", () => {
      mode = mode === "login" ? "register" : "login";
      const isLogin = mode === "login";
      title.textContent = isLogin ? "Log in" : "Register";
      submitBtn.textContent = isLogin ? "Log in" : "Register";
      toggleText.textContent = isLogin ? "Don't have an account?" : "Already have an account?";
      toggleLink.textContent = isLogin ? "Register" : "Log in";
      errorEl.textContent = "";
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorEl.textContent = "";

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        if (mode === "login") {
          await login(email, password);
          window.location.href = "/static/dashboard.html";
        } else {
          await register(email, password);
          await login(email, password);
          window.location.href = "/static/dashboard.html";
        }
      } catch (err) {
        errorEl.textContent = err.message;
      }
    });
  </script>
</body>
</html>
