version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: travel
      POSTGRES_PASSWORD: travel
      POSTGRES_DB: travel_planner
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  app:
    build: .
    env_file: .env
    depends_on:
      - db
      - redis
    ports:
      - "8080:8000"
    volumes:
      - ./app:/code/app
      - ./static:/code/static

volumes:
  db_data:
